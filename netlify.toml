# Configuração de deploy estático (Netlify).
# App sem etapa de build: apenas publica a pasta src/.
[build]
  publish = "src"
  command = ""

# Boas práticas de segurança para o app de campo (SST).
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
