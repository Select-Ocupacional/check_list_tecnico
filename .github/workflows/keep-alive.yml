name: Supabase keep-alive

# Mantém o projeto Supabase (plano Free) ativo, evitando a pausa automática
# por ~7 dias de inatividade. Faz uma requisição leve ao banco 1x/dia.
# A chave usada é a "anon/publishable" (pública por design, já no app).

on:
  schedule:
    - cron: "17 12 * * *"   # todo dia ~12:17 UTC (~09:17 no horário de Brasília)
  workflow_dispatch: {}      # permite disparar manualmente pela aba Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (consulta leve ao banco)
        env:
          SUPABASE_URL: "https://nvlzvtuvmmgvienkjpmy.supabase.co"
          SUPABASE_ANON_KEY: "sb_publishable_RB57tK2zoYl339Dp7Dk2RQ_yfdUj9k_"
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            "${SUPABASE_URL}/rest/v1/perfis?select=user_id&limit=1")
          echo "Resposta do Supabase: HTTP ${code}"
          # Qualquer resposta HTTP (200/206/401/…) significa projeto ativo.
          # Só falha se não houve resposta (rede/DNS/projeto fora do ar).
          if [ "${code}" = "000" ]; then
            echo "::error::Supabase nao respondeu (projeto pode estar pausado ou fora do ar)."
            exit 1
          fi
